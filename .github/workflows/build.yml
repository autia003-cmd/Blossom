name: Build Blossom

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pymem requests PyQt6 pyinstaller

      - name: Verify pymem
        shell: pwsh
        run: |
          python -c "import pymem; print('pymem OK:', pymem.__file__)"

      - name: Check source
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:GITHUB_WORKSPACE\Blossom.py")) {
            Write-Error "Blossom.py was not found."
            exit 1
          }

          python -m py_compile "$env:GITHUB_WORKSPACE\Blossom.py"

      - name: Build EXE
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force "$env:GITHUB_WORKSPACE\build" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "$env:GITHUB_WORKSPACE\dist" -ErrorAction SilentlyContinue

          python -m PyInstaller `
            --clean `
            --noconfirm `
            --onefile `
            --windowed `
            --name Blossom `
            --distpath "$env:GITHUB_WORKSPACE\dist" `
            --workpath "$env:GITHUB_WORKSPACE\build" `
            --collect-all pymem `
            --collect-all PyQt6 `
            "$env:GITHUB_WORKSPACE\Blossom.py"

      - name: Verify EXE
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:GITHUB_WORKSPACE\dist\Blossom.exe")) {
            Write-Error "Blossom.exe was not created."
            exit 1
          }

          Write-Host "Blossom.exe created successfully."

      - name: Upload EXE
        uses: actions/upload-artifact@v6
        with:
          name: Blossom-Windows
          path: dist/Blossom.exe
