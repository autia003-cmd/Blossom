name: Build Blossom

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Find Blossom.py
        shell: pwsh
        run: |
          $source = Get-ChildItem `
            -Path "$env:GITHUB_WORKSPACE" `
            -Recurse `
            -File `
            -Filter "Blossom.py" |
            Select-Object -First 1

          if (-not $source) {
            Write-Error "Blossom.py was not found anywhere in the repository."
            exit 1
          }

          Write-Host "Found Blossom.py:"
          Write-Host $source.FullName

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pymem requests PyQt6 pyinstaller

      - name: Verify pymem
        shell: pwsh
        run: |
          python -c "import pymem; print('pymem OK:', pymem.__file__)"

      - name: Check source
        shell: pwsh
        run: |
          $source = Get-ChildItem `
            -Path "$env:GITHUB_WORKSPACE" `
            -Recurse `
            -File `
            -Filter "Blossom.py" |
            Select-Object -First 1

          if (-not $source) {
            Write-Error "Blossom.py was not found."
            exit 1
          }

          python -m py_compile "$($source.FullName)"

      - name: Build EXE
        shell: pwsh
        run: |
          $source = Get-ChildItem `
            -Path "$env:GITHUB_WORKSPACE" `
            -Recurse `
            -File `
            -Filter "Blossom.py" |
            Select-Object -First 1

          if (-not $source) {
            Write-Error "Blossom.py was not found."
            exit 1
          }

          $icon = Join-Path $source.Directory.FullName "assets\blossom.ico"

          Remove-Item `
            -Recurse `
            -Force `
            "$env:GITHUB_WORKSPACE\build" `
            -ErrorAction SilentlyContinue

          Remove-Item `
            -Recurse `
            -Force `
            "$env:GITHUB_WORKSPACE\dist" `
            -ErrorAction SilentlyContinue

          python -m PyInstaller `
            --clean `
            --noconfirm `
            --onefile `
            --windowed `
            --name Blossom `
            --distpath "$env:GITHUB_WORKSPACE\dist" `
            --workpath "$env:GITHUB_WORKSPACE\build" `
            --collect-all pymem `
            --collect-all PyQt6 `
            --icon "$icon" `
            "$($source.FullName)"

      - name: Verify EXE
        shell: pwsh
        run: |
          $exe = "$env:GITHUB_WORKSPACE\dist\Blossom.exe"

          if (-not (Test-Path $exe)) {
            Write-Error "Blossom.exe was not created."
            exit 1
          }

          Write-Host "Blossom.exe created successfully."

      - name: Upload EXE
        uses: actions/upload-artifact@v6
        with:
          name: Blossom-Windows
          path: dist/Blossom.exe
