name: Build Blossom

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Check Python syntax
        run: |
          python -m py_compile Blossom.py

      - name: Build EXE
        run: |
          pyinstaller Blossom.spec

      - name: Verify EXE
        run: |
          if (!(Test-Path "dist\Blossom.exe")) {
            Write-Error "Blossom.exe was not created."
            exit 1
          }

          Write-Host "Blossom.exe successfully created."

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Blossom-Windows
          path: dist/Blossom.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Blossom.exe
          generate_release_notes: true
